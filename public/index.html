<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Notion Generic Database Search & Filter</title>
<style>
  :root {
    --bg: #f8fafc;
    --panel: #ffffff;
    --panel-sub: #f1f5f9;
    --ink: #0f172a;
    --muted: #64748b;
    --line: #e2e8f0;
    --line-focus: #3b82f6;
    --accent: #2563eb;
    --accent-hover: #1d4ed8;
    --accent-soft: #eff6ff;
    --accent-border: #bfdbfe;
    --mark: #fef08a;
    --chip: #f1f5f9;
    --chip-hover: #e2e8f0;
    --radius: 12px;
    --radius-sm: 8px;
    --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
    --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.07), 0 2px 4px -2px rgb(0 0 0 / 0.05);
    --transition: all 0.15s cubic-bezier(0.4, 0, 0.2, 1);
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0b0f17;
      --panel: #131b2e;
      --panel-sub: #1e293b;
      --ink: #f8fafc;
      --muted: #94a3b8;
      --line: #24324d;
      --line-focus: #60a5fa;
      --accent: #3b82f6;
      --accent-hover: #60a5fa;
      --accent-soft: #172554;
      --accent-border: #1e3a8a;
      --mark: #713f12;
      --chip: #1e293b;
      --chip-hover: #2e3d55;
    }
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    font-size: 14.5px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }

  .wrap {
    max-width: 1140px;
    margin: 0 auto;
    padding: 32px 24px 80px;
  }

  /* Header */
  header {
    margin-bottom: 24px;
  }
  .header-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    flex-wrap: wrap;
    margin-bottom: 8px;
  }
  .app-title {
    display: flex;
    align-items: center;
    gap: 10px;
    margin: 0;
    font-size: 22px;
    font-weight: 700;
    letter-spacing: -0.02em;
  }
  .app-title span.badge {
    font-size: 12px;
    font-weight: 600;
    background: var(--accent-soft);
    color: var(--accent);
    padding: 3px 8px;
    border-radius: 999px;
    border: 1px solid var(--accent-border);
  }
  .header-links {
    display: flex;
    align-items: center;
    gap: 12px;
    font-size: 13px;
  }
  .header-links a, .header-links button {
    color: var(--muted);
    text-decoration: none;
    background: none;
    border: 0;
    padding: 0;
    cursor: pointer;
    font: inherit;
    display: inline-flex;
    align-items: center;
    gap: 4px;
  }
  .header-links a:hover, .header-links button:hover {
    color: var(--accent);
    text-decoration: underline;
  }

  /* Database Selector Bar */
  .db-bar {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 14px 18px;
    margin-bottom: 16px;
    display: flex;
    align-items: center;
    gap: 14px;
    box-shadow: var(--shadow-sm);
    flex-wrap: wrap;
  }
  .db-label {
    font-size: 12px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--muted);
    white-space: nowrap;
  }
  .db-select-wrap {
    flex: 1;
    min-width: 240px;
    display: flex;
    gap: 10px;
    align-items: center;
  }
  .db-select {
    flex: 1;
    padding: 9px 12px;
    font-size: 15px;
    font-weight: 600;
    border-radius: var(--radius-sm);
    border: 1px solid var(--line);
    background: var(--bg);
    color: var(--ink);
    cursor: pointer;
    outline: none;
    transition: var(--transition);
  }
  .db-select:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 2px var(--accent-soft);
  }
  .btn-refresh {
    padding: 8px 12px;
    font-size: 13px;
    font-weight: 500;
    background: var(--chip);
    border: 1px solid var(--line);
    color: var(--ink);
    border-radius: var(--radius-sm);
    cursor: pointer;
    transition: var(--transition);
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }
  .btn-refresh:hover {
    background: var(--chip-hover);
  }
  .db-meta-badge {
    font-size: 12px;
    color: var(--muted);
    display: flex;
    align-items: center;
    gap: 8px;
  }

  /* Main Filter Panel */
  .panel {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 20px;
    box-shadow: var(--shadow-sm);
  }

  .searchrow {
    display: flex;
    gap: 10px;
  }
  .searchrow input[type=search] {
    flex: 1;
    min-width: 0;
    padding: 12px 16px;
    font-size: 15px;
    border: 1px solid var(--line);
    border-radius: var(--radius-sm);
    background: var(--bg);
    color: var(--ink);
    transition: var(--transition);
  }
  .searchrow input[type=search]:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-soft);
  }
  button {
    font: inherit;
    cursor: pointer;
    border-radius: var(--radius-sm);
    border: 1px solid var(--line);
    background: var(--panel);
    color: var(--ink);
    padding: 10px 16px;
    transition: var(--transition);
  }
  button.primary {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
    font-weight: 600;
    padding: 12px 24px;
  }
  button.primary:hover {
    background: var(--accent-hover);
    border-color: var(--accent-hover);
  }

  /* Filter Grid */
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 16px;
    margin-top: 20px;
  }
  .filter-col {
    display: flex;
    flex-direction: column;
  }
  .lblrow {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 6px;
  }
  label.lbl {
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--muted);
    font-weight: 600;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .type-tag {
    font-size: 10px;
    font-weight: 500;
    padding: 1px 5px;
    border-radius: 4px;
    background: var(--chip);
    color: var(--muted);
    text-transform: lowercase;
  }
  .clearbtn {
    border: 0;
    background: none;
    color: var(--accent);
    padding: 0;
    font-size: 11.5px;
    font-weight: 600;
    cursor: pointer;
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }
  .clearbtn[hidden] { display: none; }
  .clearbtn:hover { text-decoration: underline; }

  select {
    width: 100%;
    padding: 9px 10px;
    border: 1px solid var(--line);
    border-radius: var(--radius-sm);
    background: var(--bg);
    color: var(--ink);
    font: inherit;
    font-size: 13.5px;
    transition: var(--transition);
  }
  select:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 2px var(--accent-soft);
  }
  select[multiple] {
    height: 118px;
  }

  .number-filter-wrap {
    display: flex;
    gap: 6px;
  }
  .number-filter-wrap select {
    width: 75px;
    flex-shrink: 0;
  }
  .number-filter-wrap input[type=number] {
    flex: 1;
    min-width: 0;
    padding: 8px 10px;
    border: 1px solid var(--line);
    border-radius: var(--radius-sm);
    background: var(--bg);
    color: var(--ink);
  .grid input[type=text],
  .grid input[type=date] {
    width: 100%;
    padding: 9px 10px;
    border: 1px solid var(--line);
    border-radius: var(--radius-sm);
    background: var(--bg);
    color: var(--ink);
    font: inherit;
    font-size: 13.5px;
    transition: var(--transition);
  }
  .grid input[type=text]:focus,
  .grid input[type=date]:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 2px var(--accent-soft);
  }

  /* Active Filter Chips */
  .active-bar {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    align-items: center;
    margin-top: 18px;
    padding-top: 14px;
    border-top: 1px dashed var(--line);
  }
  .active-bar:empty { display: none; }
  .active-bar .lead {
    font-size: 11.5px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--muted);
    font-weight: 600;
  }
  .fchip {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: var(--accent-soft);
    color: var(--accent);
    border: 1px solid var(--accent-border);
    border-radius: 999px;
    padding: 4px 8px 4px 12px;
    font-size: 12.5px;
    font-weight: 500;
  }
  .fchip span.k {
    opacity: 0.75;
    font-weight: 600;
  }
  .fchip button {
    border: 0;
    background: none;
    color: inherit;
    cursor: pointer;
    padding: 0 4px;
    font-size: 15px;
    line-height: 1;
    border-radius: 999px;
    opacity: 0.7;
  }
  .fchip button:hover {
    opacity: 1;
    background: rgba(0, 0, 0, 0.1);
  }
  .clearall {
    border: 0;
    background: none;
    color: var(--muted);
    font-size: 12.5px;
    cursor: pointer;
    text-decoration: underline;
    padding: 4px 8px;
  }
  .clearall:hover {
    color: var(--ink);
  }

  /* Actions */
  .actions {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-top: 18px;
    flex-wrap: wrap;
  }
  .spacer { flex: 1; }
  .hint { font-size: 13px; color: var(--muted); }

  /* Results Meta */
  .meta-bar {
    color: var(--muted);
    font-size: 13.5px;
    margin: 24px 0 14px;
    display: flex;
    gap: 12px;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
  }
  .meta-count {
    font-weight: 600;
    color: var(--ink);
  }

  /* Cards */
  .results-grid {
    display: flex;
    flex-direction: column;
    gap: 16px;
  }
  .card {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 18px 22px;
    box-shadow: var(--shadow-sm);
    transition: var(--transition);
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .card:hover {
    border-color: var(--accent-border);
    box-shadow: var(--shadow-md);
    transform: translateY(-1px);
  }
  .card-header {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 16px;
    flex-wrap: wrap;
  }
  .card-title-wrap {
    display: flex;
    align-items: baseline;
    gap: 8px;
    flex: 1;
    min-width: 260px;
  }
  .card-title-icon {
    font-size: 18px;
    line-height: 1;
  }
  .card h3 {
    margin: 0;
    font-size: 17px;
    font-weight: 700;
    line-height: 1.35;
    letter-spacing: -0.01em;
  }
  .card h3 a {
    color: var(--ink);
    text-decoration: none;
    transition: var(--transition);
  }
  .card h3 a:hover {
    color: var(--accent);
    text-decoration: underline;
  }
  .card-meta-right {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
  }
  .card-time {
    font-size: 12px;
    color: var(--muted);
    white-space: nowrap;
    display: inline-flex;
    align-items: center;
    gap: 4px;
  }

  /* Separated Key-Value Fields Grid */
  .fields-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
    gap: 10px;
    margin-top: 4px;
  }
  .field-box {
    background: var(--panel-sub);
    border: 1px solid var(--line);
    border-radius: var(--radius-sm);
    padding: 8px 12px;
    display: flex;
    flex-direction: column;
    gap: 4px;
    transition: var(--transition);
  }
  .field-box:hover {
    border-color: var(--accent-border);
  }
  .field-name {
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--muted);
    display: flex;
    align-items: center;
    gap: 5px;
  }
  .field-val {
    font-size: 13.5px;
    color: var(--ink);
    font-weight: 500;
    display: flex;
    align-items: center;
    gap: 6px;
    flex-wrap: wrap;
    min-height: 24px;
  }

  .prop-pill {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    border: 1px solid transparent;
    border-radius: 6px;
    padding: 2px 8px;
    font-size: 12px;
    font-weight: 600;
  }

  /* Notion colors */
  .pill-gray { background: #f3f4f6; color: #374151; border-color: #e5e7eb; }
  .pill-blue { background: #eff6ff; color: #1e40af; border-color: #bfdbfe; }
  .pill-green { background: #f0fdf4; color: #166534; border-color: #bbf7d0; }
  .pill-yellow { background: #fefce8; color: #854d0e; border-color: #fef08a; }
  .pill-orange { background: #fff7ed; color: #9a3412; border-color: #fed7aa; }
  .pill-red { background: #fef2f2; color: #991b1b; border-color: #fecaca; }
  .pill-purple { background: #faf5ff; color: #6b21a8; border-color: #e9d5ff; }
  .pill-pink { background: #fdf2f8; color: #9d174d; border-color: #fbcfe8; }

  @media (prefers-color-scheme: dark) {
    .pill-gray { background: #1f2937; color: #e5e7eb; border-color: #374151; }
    .pill-blue { background: #172554; color: #bfdbfe; border-color: #1e3a8a; }
    .pill-green { background: #052e16; color: #bbf7d0; border-color: #14532d; }
    .pill-yellow { background: #422006; color: #fef08a; border-color: #713f12; }
    .pill-orange { background: #431407; color: #fed7aa; border-color: #7c2d12; }
    .pill-red { background: #450a0a; color: #fecaca; border-color: #7f1d1d; }
    .pill-purple { background: #3b0764; color: #e9d5ff; border-color: #581c87; }
    .pill-pink { background: #500724; color: #fbcfe8; border-color: #831843; }
  }

  /* Search match highlights */
  .match-banner {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 6px 12px;
    border-radius: 8px;
    background: var(--accent-soft);
    border: 1px solid var(--accent-border);
    font-size: 12px;
    color: var(--accent);
    font-weight: 600;
    flex-wrap: wrap;
  }
  .match-tag {
    background: var(--panel);
    border: 1px solid var(--accent-border);
    color: var(--accent);
    border-radius: 999px;
    padding: 2px 9px;
    font-size: 11px;
    font-weight: 600;
  }

  /* Content sections */
  .card-section {
    background: var(--panel-sub);
    border: 1px solid var(--line);
    border-radius: var(--radius-sm);
    padding: 12px 14px;
    font-size: 13.5px;
    line-height: 1.5;
  }
  .card-section-title {
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--muted);
    margin-bottom: 6px;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  /* Comments */
  .comments-wrap {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .comment-item {
    background: var(--panel-sub);
    border: 1px solid var(--line);
    border-left: 3px solid var(--accent);
    border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
    padding: 10px 14px;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .comment-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 12px;
  }
  .comment-author {
    font-weight: 600;
    color: var(--ink);
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .comment-avatar {
    width: 20px;
    height: 20px;
    border-radius: 50%;
    background: var(--accent);
    color: #fff;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 10.5px;
    font-weight: 700;
  }
  .comment-tag-inline {
    font-size: 10.5px;
    padding: 1px 5px;
    background: var(--chip);
    border: 1px solid var(--line);
    border-radius: 4px;
    color: var(--muted);
  }
  .comment-time {
    font-size: 11.5px;
    color: var(--muted);
  }
  .comment-body {
    font-size: 13px;
    color: var(--ink);
    line-height: 1.45;
  }

  mark {
    background: var(--mark);
    color: inherit;
    border-radius: 3px;
    padding: 0 3px;
    font-weight: 600;
  }

  .empty {
    padding: 48px;
    text-align: center;
    color: var(--muted);
    background: var(--panel);
    border: 1px dashed var(--line);
    border-radius: var(--radius);
  }

  /* Debug details */
  details.debug {
    margin-top: 24px;
    font-size: 13px;
    color: var(--muted);
  }
  details.debug summary {
    cursor: pointer;
    font-weight: 600;
    padding: 6px 0;
  }
  details.debug pre {
    background: var(--panel-sub);
    border: 1px solid var(--line);
    border-radius: var(--radius-sm);
    padding: 14px;
    overflow: auto;
    font-size: 12px;
    color: var(--ink);
    line-height: 1.4;
  }

  .err {
    background: #fee2e2;
    border: 1px solid #fca5a5;
    color: #991b1b;
    padding: 14px 18px;
    border-radius: var(--radius-sm);
    margin-bottom: 16px;
  }
  @media (prefers-color-scheme: dark) {
    .err { background: #450a0a; border-color: #7f1d1d; color: #fca5a5; }
  }

  .loading-spinner {
    display: inline-block;
    width: 14px;
    height: 14px;
    border: 2px solid rgba(0,0,0,0.2);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.6s linear infinite;
    vertical-align: middle;
    margin-right: 6px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="header-top">
      <h1 class="app-title">
        <span>⚡ Notion Universal Search & Filter</span>
        <span class="badge">Generic Schema</span>
      </h1>
      <div class="header-links">
        <a href="/api/databases" target="_blank">📡 /api/databases</a>
        <a href="/api/filter-instructions" id="api-filters-link" target="_blank">📋 /api/filter-instructions</a>
      </div>
    </div>
  </header>

  <!-- Database Selector -->
  <div class="db-bar">
    <span class="db-label">Database</span>
    <div class="db-select-wrap">
      <select id="db-select" class="db-select" title="Select a Database"></select>
      <button type="button" id="btn-refresh" class="btn-refresh" title="Refresh database discovery">
        🔄 Refresh
      </button>
    </div>
    <div class="db-meta-badge" id="db-meta-badge"></div>
  </div>

  <form class="panel" id="form">
    <div class="searchrow">
      <input type="search" id="q" name="q" placeholder="Free text search across all fields, page body & comments..." autocomplete="off">
      <button class="primary" type="submit">Search</button>
    </div>

    <!-- Dynamically rendered filter controls -->
    <div class="grid" id="filters-grid"></div>

    <!-- Active filter chips -->
    <div class="active-bar" id="active-bar"></div>

    <div class="actions">
      <button type="button" id="btn-clear-all">Clear all filters</button>
      <span class="spacer"></span>
      <span class="hint">Hold ⌘/Ctrl to select multiple options. Changes filter dynamically.</span>
    </div>
  </form>

  <div class="meta-bar">
    <div class="meta-count" id="meta-count">Loading databases…</div>
    <div id="meta-sub"></div>
  </div>

  <div id="results" class="results-grid"></div>

  <div class="actions" id="morewrap" hidden>
    <button id="btn-load-more" class="primary">Load the remaining results</button>
  </div>

  <details class="debug" id="debugwrap" hidden>
    <summary>Query Execution & Filter Details</summary>
    <pre id="debug"></pre>
  </details>
</div>

<script type="module">
const $ = (s) => document.querySelector(s);
const el = (t, cls, txt) => {
  const n = document.createElement(t);
  if (cls) n.className = cls;
  if (txt != null) n.textContent = txt;
  return n;
};

const esc = (s) =>
  String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

function highlight(text, q) {
  if (!text) return '';
  if (!q) return esc(text);
  const re = new RegExp(`(${q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')})`, 'ig');
  return esc(text).replace(re, '<mark>$1</mark>');
}

const PAGE_SIZE = 100;
const AUTO_LOAD_LIMIT = 500;

let DATABASES = [];
let ACTIVE_DB_ID = null;
let ACTIVE_SCHEMA = null;
let ACTIVE_FILTER_DOC = null;
let LABELS = {}; // filter key -> { id: label }
let SEARCH_TOKEN = 0;

// ---------- Initialization ----------

async function boot() {
  await loadDatabases();
}

async function loadDatabases(refresh = false) {
  $('#meta-count').innerHTML = '<span class="loading-spinner"></span> Discovering databases from Notion…';
  try {
    const res = await fetch('/api/databases' + (refresh ? '?refresh=1' : ''));
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Failed to discover databases');

    DATABASES = data.databases || [];
    const select = $('#db-select');
    select.innerHTML = '';

    if (DATABASES.length === 0) {
      select.innerHTML = '<option value="">No databases found</option>';
      $('#meta-count').textContent = 'No databases shared with integration.';
      return;
    }

    for (const db of DATABASES) {
      const opt = document.createElement('option');
      opt.value = db.id;
      const icon = db.icon?.type === 'emoji' ? db.icon.emoji + ' ' : '📄 ';
      opt.textContent = `${icon}${db.title} (${db.properties_count} properties)`;
      select.appendChild(opt);
    }

    if (!ACTIVE_DB_ID || !DATABASES.some((d) => d.id === ACTIVE_DB_ID)) {
      ACTIVE_DB_ID = DATABASES[0].id;
    }
    select.value = ACTIVE_DB_ID;

    select.onchange = () => {
      ACTIVE_DB_ID = select.value;
      switchDatabase(ACTIVE_DB_ID);
    };

    await switchDatabase(ACTIVE_DB_ID, refresh);
  } catch (err) {
    $('#results').innerHTML = `<div class="err">${esc(err.message)}</div>`;
    $('#meta-count').textContent = 'Error loading databases';
  }
}

async function switchDatabase(databaseId, refresh = false) {
  $('#meta-count').innerHTML = '<span class="loading-spinner"></span> Discovering schema & capabilities…';
  $('#api-filters-link').href = `/api/filter-instructions/${databaseId}`;

  const currentDb = DATABASES.find((d) => d.id === databaseId);
  if (currentDb) {
    $('#db-meta-badge').innerHTML = `
      <span>${currentDb.properties_count} properties</span> ·
      <a href="${esc(currentDb.url)}" target="_blank" rel="noreferrer">Open in Notion ↗</a>
    `;
  }

  try {
    const [optionsRes, filtersRes] = await Promise.all([
      fetch(`/api/options?database_id=${databaseId}${refresh ? '&refresh=1' : ''}`).then((r) => r.json()),
      fetch(`/api/filter-instructions/${databaseId}${refresh ? '&refresh=1' : ''}`).then((r) => r.json()),
    ]);

    ACTIVE_SCHEMA = optionsRes;
    ACTIVE_FILTER_DOC = filtersRes;
    LABELS = {};

    renderDynamicControls(optionsRes);
    syncControls();
    runSearch();
  } catch (err) {
    $('#results').innerHTML = `<div class="err">${esc(err.message)}</div>`;
    $('#meta-count').textContent = 'Error loading schema';
  }
}

// ---------- Dynamic Control Rendering ----------

function renderDynamicControls(schema) {
  const grid = $('#filters-grid');
  grid.innerHTML = '';

  const properties = schema.properties || [];
  for (const p of properties) {
    // Skip raw free-text properties from filter dropdowns since searchText searches across all fields
    if (p.type === 'title' || p.type === 'rich_text') continue;

    const slug = p.name.toLowerCase().replace(/[^a-z0-9]+/g, '_');
    const col = el('div', 'filter-col');
    const lblRow = el('div', 'lblrow');
    const lbl = el('label', 'lbl');
    lbl.textContent = p.name;
    lbl.setAttribute('for', 'filter-' + slug);

    const typeTag = el('span', 'type-tag', p.type);
    lbl.appendChild(typeTag);

    const clearBtn = el('button', 'clearbtn', 'clear');
    clearBtn.type = 'button';
    clearBtn.dataset.clear = slug;
    clearBtn.hidden = true;
    clearBtn.onclick = () => clearOne(slug);

    lblRow.append(lbl, clearBtn);
    col.appendChild(lblRow);

    LABELS[slug] = {};

    if (p.type === 'select' || p.type === 'multi_select' || p.type === 'status') {
      const sel = el('select');
      sel.id = 'filter-' + slug;
      sel.multiple = true;
      sel.dataset.field = p.name;
      sel.dataset.slug = slug;

      const noneOpt = new Option('— Empty / None —', 'none');
      sel.appendChild(noneOpt);
      LABELS[slug]['none'] = 'Empty / None';

      const options = p.options || schema.options_by_property?.[p.name] || [];
      for (const val of options) {
        const countTxt = val.count ? ` (${val.count})` : '';
        const opt = new Option(`${val.name}${countTxt}`, val.name);
        sel.appendChild(opt);
        LABELS[slug][val.name] = val.name;
      }
      sel.onchange = () => { syncControls(); runSearch(); };
      col.appendChild(sel);
    } else if (p.type === 'people') {
      const sel = el('select');
      sel.id = 'filter-' + slug;
      sel.multiple = true;
      sel.dataset.field = p.name;
      sel.dataset.slug = slug;

      const noneOpt = new Option('— Unassigned —', 'none');
      sel.appendChild(noneOpt);
      LABELS[slug]['none'] = 'Unassigned';

      const users = p.users || schema.people_by_property?.[p.name] || [];
      for (const u of users) {
        const countTxt = u.count ? ` (${u.count})` : '';
        const opt = new Option(`${u.label || u.name}${countTxt}`, u.name || u.label || u.id);
        sel.appendChild(opt);
        LABELS[slug][u.name || u.label || u.id] = u.label || u.name;
      }
      sel.onchange = () => { syncControls(); runSearch(); };
      col.appendChild(sel);
    } else if (p.type === 'relation') {
      const sel = el('select');
      sel.id = 'filter-' + slug;
      sel.multiple = true;
      sel.dataset.field = p.name;
      sel.dataset.slug = slug;

      const noneOpt = new Option('— No relation —', 'none');
      sel.appendChild(noneOpt);
      LABELS[slug]['none'] = 'No relation';

      const targets = p.targets || schema.relations_by_property?.[p.name] || [];
      for (const t of targets) {
        const countTxt = t.count ? ` (${t.count})` : '';
        const opt = new Option(`${t.label || t.title}${countTxt}`, t.title || t.label || t.id);
        sel.appendChild(opt);
        LABELS[slug][t.title || t.label || t.id] = t.label || t.title;
      }
      sel.onchange = () => { syncControls(); runSearch(); };
      col.appendChild(sel);
    } else if (p.type === 'checkbox') {
      const sel = el('select');
      sel.id = 'filter-' + slug;
      sel.dataset.field = p.name;
      sel.dataset.slug = slug;
      sel.appendChild(new Option('All', ''));
      sel.appendChild(new Option('Checked (True)', 'true'));
      sel.appendChild(new Option('Unchecked (False)', 'false'));
      LABELS[slug]['true'] = 'Checked';
      LABELS[slug]['false'] = 'Unchecked';
      sel.onchange = () => { syncControls(); runSearch(); };
      col.appendChild(sel);
    } else if (p.type === 'number') {
      const wrap = el('div', 'number-filter-wrap');
      const opSel = el('select');
      opSel.id = 'filter-op-' + slug;
      opSel.appendChild(new Option('=', ''));
      opSel.appendChild(new Option('>=', '>='));
      opSel.appendChild(new Option('<=', '<='));
      opSel.appendChild(new Option('>', '>'));
      opSel.appendChild(new Option('<', '<'));
      opSel.appendChild(new Option('!=', '!='));

      const numInput = el('input');
      numInput.type = 'number';
      numInput.id = 'filter-' + slug;
      numInput.dataset.field = p.name;
      numInput.dataset.slug = slug;
      numInput.placeholder = p.format || '0';

      opSel.onchange = () => { syncControls(); runSearch(); };
      numInput.oninput = () => { syncControls(); runSearch(); };
      wrap.append(opSel, numInput);
      col.appendChild(wrap);
    } else if (p.type === 'date') {
      const sel = el('select');
      sel.id = 'filter-' + slug;
      sel.dataset.field = p.name;
      sel.dataset.slug = slug;
      sel.appendChild(new Option('All dates', ''));
      sel.appendChild(new Option('Past week', 'past_week'));
      sel.appendChild(new Option('This week', 'this_week'));
      sel.appendChild(new Option('Next week', 'next_week'));
      sel.appendChild(new Option('Past month', 'past_month'));
      LABELS[slug]['past_week'] = 'Past week';
      LABELS[slug]['this_week'] = 'This week';
      LABELS[slug]['next_week'] = 'Next week';
      LABELS[slug]['past_month'] = 'Past month';
      sel.onchange = () => { syncControls(); runSearch(); };
      col.appendChild(sel);
    }

    grid.appendChild(col);
  }
}

// ---------- Filter Helpers ----------

const pickedValues = (slug) => {
  const el = $('#filter-' + slug);
  if (!el) return [];
  if (el.tagName === 'SELECT' && el.multiple) {
    return [...el.selectedOptions].map((o) => o.value);
  }
  if (el.tagName === 'SELECT') {
    return el.value ? [el.value] : [];
  }
  if (el.tagName === 'INPUT' && el.type === 'number') {
    const val = el.value.trim();
    if (!val) return [];
    const op = $('#filter-op-' + slug)?.value || '';
    return [op + val];
  }
  return el.value ? [el.value.trim()] : [];
};

function clearOne(slug) {
  const el = $('#filter-' + slug);
  if (!el) return;
  if (el.tagName === 'SELECT' && el.multiple) {
    for (const o of el.options) o.selected = false;
  } else if (el.tagName === 'SELECT') {
    el.value = '';
  } else {
    el.value = '';
  }
  syncControls();
  runSearch();
}

function clearValue(slug, value) {
  const el = $('#filter-' + slug);
  if (!el) return;
  if (el.tagName === 'SELECT' && el.multiple) {
    for (const o of el.options) {
      if (o.value === value) o.selected = false;
    }
  } else {
    el.value = '';
  }
  syncControls();
  runSearch();
}

function clearAll() {
  $('#q').value = '';
  for (const p of ACTIVE_SCHEMA?.properties || []) {
    const slug = p.name.toLowerCase().replace(/[^a-z0-9]+/g, '_');
    clearOne(slug);
  }
  syncControls();
  runSearch();
}

function syncControls() {
  const properties = ACTIVE_SCHEMA?.properties || [];
  for (const p of properties) {
    const slug = p.name.toLowerCase().replace(/[^a-z0-9]+/g, '_');
    const vals = pickedValues(slug);
    const clearBtn = $(`.clearbtn[data-clear="${slug}"]`);
    if (clearBtn) clearBtn.hidden = vals.length === 0;
  }

  const bar = $('#active-bar');
  bar.innerHTML = '';
  const chips = [];

  const q = $('#q').value.trim();
  if (q) chips.push({ k: 'Search', label: `"${q}"`, onclear: () => { $('#q').value = ''; syncControls(); runSearch(); } });

  for (const p of properties) {
    const slug = p.name.toLowerCase().replace(/[^a-z0-9]+/g, '_');
    for (const v of pickedValues(slug)) {
      const label = LABELS[slug]?.[v] || v;
      chips.push({
        k: p.name,
        label,
        onclear: () => clearValue(slug, v),
      });
    }
  }

  if (!chips.length) return;

  bar.append(el('span', 'lead', 'Active Filters'));
  for (const c of chips) {
    const chip = el('span', 'fchip');
    chip.append(el('span', 'k', c.k + ':'), document.createTextNode(' ' + c.label));
    const x = el('button', null, '×');
    x.type = 'button';
    x.title = `Remove ${c.k} filter`;
    x.onclick = c.onclear;
    chip.append(x);
    bar.append(chip);
  }

  const all = el('button', 'clearall', 'Clear all');
  all.type = 'button';
  all.onclick = clearAll;
  bar.append(all);
}

// ---------- Search Execution ----------

function collectRequestBody(offset = 0) {
  const body = {
    databaseId: ACTIVE_DB_ID,
    pageSize: PAGE_SIZE,
    offset,
  };
  const q = $('#q').value.trim();
  if (q) body.searchText = q;

  const filter = {};
  for (const p of ACTIVE_SCHEMA?.properties || []) {
    const slug = p.name.toLowerCase().replace(/[^a-z0-9]+/g, '_');
    const vals = pickedValues(slug);
    if (vals.length) {
      filter[p.name] = vals.length === 1 ? vals[0] : vals;
    }
  }
  if (Object.keys(filter).length > 0) {
    body.filter = filter;
  }
  return body;
}

async function runSearch(startOffset = 0) {
  const token = ++SEARCH_TOKEN;
  const box = $('#results');
  if (startOffset === 0) box.innerHTML = '';
  $('#morewrap').hidden = true;

  let offset = startOffset;
  let shown = box.querySelectorAll('.card').length;
  const q = $('#q').value.trim();

  while (true) {
    $('#meta-count').innerHTML = shown
      ? `<span class="loading-spinner"></span> Loaded ${shown} results…`
      : '<span class="loading-spinner"></span> Searching…';

    const body = collectRequestBody(offset);

    let data;
    try {
      const res = await fetch('/api/search', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body),
      });
      data = await res.json();
      if (!res.ok) throw new Error(data.error || res.statusText);
    } catch (e) {
      if (token !== SEARCH_TOKEN) return;
      $('#meta-count').textContent = 'Search error';
      box.innerHTML = `<div class="err">${esc(e.message)}</div>`;
      return;
    }

    if (token !== SEARCH_TOKEN) return;

    for (const r of data.results || []) {
      box.append(renderCard(r, q));
    }
    shown += (data.results || []).length;
    offset += (data.results || []).length;

    $('#debugwrap').hidden = !data.filter_applied && !data.text_matching;
    $('#debug').textContent = JSON.stringify(
      { database: data.database, filter_applied: data.filter_applied, text_matching: data.text_matching },
      null,
      2,
    );

    if (data.notice) {
      $('#meta-count').textContent = data.notice;
      return;
    }

    if (!data.has_more) {
      $('#meta-count').textContent = shown === 0 ? '0 results' : `${data.total} result${data.total === 1 ? '' : 's'}`;
      if (!shown) {
        box.append(el('div', 'empty', 'No matching items found for current filters.'));
      }
      return;
    }

    if (shown >= AUTO_LOAD_LIMIT) {
      $('#meta-count').textContent = `${data.total} results — showing ${shown}`;
      const moreBtn = $('#btn-load-more');
      moreBtn.textContent = `Load the remaining ${data.total - shown}`;
      moreBtn.onclick = () => runSearch(offset);
      $('#morewrap').hidden = false;
      return;
    }
  }
}

// ---------- Result Card Rendering ----------

// ---------- Result Card Rendering ----------

function getPropertyIcon(pname, pval) {
  const n = pname.toLowerCase();
  if (n.includes('status')) return '🎯';
  if (n.includes('priority')) return '⚡';
  if (n.includes('assignee') || n.includes('owner') || n.includes('user') || n.includes('author') || n.includes('people')) return '👤';
  if (n.includes('epic') || n.includes('relation') || n.includes('parent') || n.includes('link')) return '🔗';
  if (n.includes('date') || n.includes('due') || n.includes('start') || n.includes('end') || n.includes('created') || n.includes('edited')) return '📅';
  if (n.includes('sprint') || n.includes('iteration')) return '🏃';
  if (n.includes('estimate') || n.includes('point') || n.includes('cost') || n.includes('number') || typeof pval === 'number') return '🔢';
  if (typeof pval === 'boolean') return '☑️';
  return '🏷️';
}

function renderCard(r, q) {
  const card = el('div', 'card');

  // Header row: Title + Last Updated Time
  const header = el('div', 'card-header');
  const titleWrap = el('div', 'card-title-wrap');
  
  const iconSpan = el('span', 'card-title-icon', '📄');
  const h3 = el('h3');
  h3.innerHTML = `<a href="${esc(r.url)}" target="_blank" rel="noreferrer">${highlight(r.title || 'Untitled', q)} <span style="font-size: 13px; opacity: 0.6;">↗</span></a>`;
  titleWrap.append(iconSpan, h3);
  header.append(titleWrap);

  const metaRight = el('div', 'card-meta-right');
  if (r.last_edited_time) {
    const time = el('span', 'card-time');
    time.innerHTML = `<span>🕒</span> Updated ${esc(r.last_edited_time.slice(0, 10))}`;
    metaRight.append(time);
  }
  header.append(metaRight);
  card.append(header);

  // Search match indicators banner
  if (r.matched_fields && r.matched_fields.length > 0) {
    const banner = el('div', 'match-banner');
    banner.append(document.createTextNode('🎯 Matched in:'));
    for (const m of r.matched_fields) {
      const label = m === 'comment' ? '💬 Comments' : (m === 'page_content' ? '📄 Page Content' : m);
      banner.append(el('span', 'match-tag', label));
    }
    card.append(banner);
  }

  // Separated Key-Value Fields Grid
  const fieldsGrid = el('div', 'fields-grid');
  let hasFields = false;

  for (const [pname, pval] of Object.entries(r.properties || {})) {
    if (pval == null || pval === '' || (Array.isArray(pval) && !pval.length)) continue;
    if (pname === ACTIVE_SCHEMA?.title_property) continue;
    if (typeof pval === 'string' && (pval.length >= 60 || pval.includes('\n'))) continue;

    hasFields = true;
    const box = el('div', 'field-box');
    const nameDiv = el('div', 'field-name');
    const icon = getPropertyIcon(pname, pval);
    nameDiv.innerHTML = `<span>${icon}</span> ${esc(pname)}`;
    box.appendChild(nameDiv);

    const valDiv = el('div', 'field-val');

    if (typeof pval === 'object' && pval.name && pval.color) {
      valDiv.innerHTML = `<span class="prop-pill pill-${pval.color}">${highlight(pval.name, q)}</span>`;
    } else if (Array.isArray(pval) && pval.length && pval[0]?.label) {
      valDiv.innerHTML = pval.map((x) => highlight(x.label, q)).join(', ');
    } else if (Array.isArray(pval)) {
      valDiv.innerHTML = pval.map((x) => {
        if (typeof x === 'object' && x?.name && x?.color) {
          return `<span class="prop-pill pill-${x.color}">${highlight(x.name, q)}</span>`;
        }
        return highlight(typeof x === 'object' ? (x?.name || x?.label || JSON.stringify(x)) : String(x), q);
      }).join(' ');
    } else if (typeof pval === 'number') {
      valDiv.innerHTML = `<b>${String(pval)}</b>`;
    } else if (typeof pval === 'boolean') {
      valDiv.innerHTML = pval ? '✓ Yes' : '✗ No';
    } else if (typeof pval === 'string') {
      valDiv.innerHTML = highlight(pval, q);
    } else {
      valDiv.innerHTML = highlight(JSON.stringify(pval), q);
    }

    box.appendChild(valDiv);
    fieldsGrid.appendChild(box);
  }

  if (hasFields) {
    card.append(fieldsGrid);
  }

  // Descriptions & Long text sections
  for (const [pname, pval] of Object.entries(r.properties || {})) {
    if (typeof pval === 'string' && (pval.length >= 60 || pval.includes('\n'))) {
      const sec = el('div', 'card-section');
      sec.innerHTML = `<div class="card-section-title">📝 ${esc(pname)}</div><div>${highlight(pval, q)}</div>`;
      card.append(sec);
    }
  }

  // Page body snippet section
  if (r.page_content) {
    const sec = el('div', 'card-section');
    sec.innerHTML = `<div class="card-section-title">📄 Page Content Excerpt</div><div>${highlight(r.page_content, q)}</div>`;
    card.append(sec);
  }

  // Comments section
  if (r.comments && r.comments.length > 0) {
    const cmtWrap = el('div', 'comments-wrap');
    const cmtHeader = el('div', 'card-section-title');
    cmtHeader.innerHTML = `💬 Comments (${r.comment_count || r.comments.length})`;
    cmtWrap.append(cmtHeader);

    for (const cm of r.comments) {
      const cItem = el('div', 'comment-item');
      const cHeader = el('div', 'comment-header');
      const authorWrap = el('div', 'comment-author');
      
      const authorName = cm.author || 'Author';
      const initial = authorName.charAt(0).toUpperCase();
      const avatar = el('span', 'comment-avatar', initial);
      authorWrap.append(avatar, document.createTextNode(authorName));
      
      if (cm.inline) {
        authorWrap.append(el('span', 'comment-tag-inline', 'inline'));
      }
      cHeader.append(authorWrap);

      if (cm.created_time) {
        const timeSpan = el('span', 'comment-time', cm.created_time.slice(0, 10));
        cHeader.append(timeSpan);
      }
      cItem.append(cHeader);

      const cBody = el('div', 'comment-body');
      cBody.innerHTML = highlight(cm.excerpt || cm.text, q);
      cItem.append(cBody);

      cmtWrap.append(cItem);
    }
    card.append(cmtWrap);
  }

  return card;
}

// ---------- Event Listeners ----------

$('#form').onsubmit = (e) => {
  e.preventDefault();
  syncControls();
  runSearch();
};

$('#q').onkeydown = (e) => {
  if (e.key === 'Enter') {
    e.preventDefault();
    syncControls();
    runSearch();
  }
};

$('#q').oninput = () => {
  if (!$('#q').value.trim()) syncControls();
};

$('#btn-clear-all').onclick = clearAll;
$('#btn-refresh').onclick = () => loadDatabases(true);

boot();
</script>
